[project]
name = "decomposing-factual-sycophancy"
version = "1.0.0"
description = "Reproduction code for the analyses and figures in 'Decomposing Factual Sycophancy in Language Models: How Size and Instruction Tuning Shape Robustness'."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.24,<2.2",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "diptest>=0.7",
    "jupytext>=1.16",
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
]

[tool.jupytext]
formats = "ipynb,py:percent"
